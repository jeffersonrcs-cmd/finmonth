name: Sync version history

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "version-history"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync version history
        run: node scripts/sync-version-history.mjs

      - name: Create history PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="automation/version-history"
          if git diff --quiet -- src/lib/versionHistory.ts; then
            echo "Version history already contains the current version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/lib/versionHistory.ts
          git commit -m "chore: sync version history [skip ci]"
          git push --force origin "$branch"

          pr_number="$(gh pr list --repo "${{ github.repository }}" --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            gh pr create               --repo "${{ github.repository }}"               --base main               --head "$branch"               --title "chore: sync version history"               --body "Sincroniza o histórico de versões com o package.json."
          else
            echo "PR #$pr_number já está aberta; branch atualizada."
          fi
