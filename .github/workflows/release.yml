name: Publicar nova versão

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de atualização da versão
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "release-version"
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Definir tipo de versão
        id: bump
        shell: bash
        run: |
          current_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            echo "use_current_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A merge from the version automation branch already contains the
          # intended version. Tag it instead of generating another version PR.
          if printf '%s\\n' "${{ github.event.head_commit.message }}" | grep -q 'automation/version-bump'; then
            echo "type=none" >> "$GITHUB_OUTPUT"
            echo "use_current_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$last_tag" ] && [ "$last_tag" != "v$current_version" ]; then
            echo "type=none" >> "$GITHUB_OUTPUT"
            echo "use_current_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$last_tag" ]; then
            commits="$(git log -1 --pretty=%B)"
          else
            commits="$(git log "$last_tag"..HEAD --pretty=%B)"
          fi

          if printf '%s\n' "$commits" | grep -Eq 'BREAKING CHANGE|BREAKING-CHANGE|^[[:alnum:]_-]+!:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$commits" | grep -Eq '^feat([(:]|$)'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

          echo "use_current_version=false" >> "$GITHUB_OUTPUT"

      - name: Atualizar versão e histórico
        if: ${{ steps.bump.outputs.use_current_version != 'true' }}
        run: |
          npm run version:${{ steps.bump.outputs.type }}
          node scripts/sync-version-history.mjs

      - name: Ler versão
        id: version
        run: echo "version=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")" >> "$GITHUB_OUTPUT"

      - name: Criar PR de versão
        if: ${{ steps.bump.outputs.use_current_version != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="automation/version-bump"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- package.json src/lib/versionHistory.ts; then
            echo "Nenhuma alteração de versão ou histórico para publicar."
            exit 0
          fi

          git switch -C "$branch"
          git add package.json src/lib/versionHistory.ts
          git commit -m "chore: publica v${{ steps.version.outputs.version }} [skip ci]"
          git push --force origin "$branch"

          pr_number="$(gh pr list --repo "${{ github.repository }}" --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            gh pr create               --repo "${{ github.repository }}"               --base main               --head "$branch"               --title "chore: publica v${{ steps.version.outputs.version }}"               --body "Atualiza a versão do FinMonth e sincroniza o histórico de versões."
          else
            echo "PR #$pr_number já está aberta; branch atualizada."
          fi

      - name: Criar tag da versão
        if: ${{ steps.bump.outputs.use_current_version == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "A tag $tag já existe."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
